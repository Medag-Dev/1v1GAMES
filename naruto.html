
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js" integrity="sha512-UXumZrZNiOwnTcZSHLOfcTs0aos2MzBWHXOHOuB0J/R44QB0dwY5JgfbvljXcklVf65Gc4El6RjZ+lnwd2az2g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="icon" href="logo.jpeg">
  <title> SHINOBI RUNNER </title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;800&family=Shojumaru&display=swap');

:root {
  /* palette*/
  --chakra-glow: rgba(0, 229, 255, 0.75);
  --glass-bg: rgba(10, 20, 32, 0.85);
  --glass-border: rgba(128, 222, 234, 0.6);

  /* Thème Hivernal Par Défaut : Neige, Glace & Ailes de Frimas */
  --sky-gradient: radial-gradient(circle at 50% 20%, #1e3a5f 0%, #0d1b2a 45%, #050b14 80%, #020509 100%);
  --ground-gradient: linear-gradient(180deg, #ffffff 0%, #e0f7fa 25%, #80deea 60%, #006064 100%);
  --ground-border: #b2ebf2;

  /* Montagnes Enneigées & Végétation d'Hiver */
  --m-back-color: #0d2137;
  --m-mid-color: #16324f;
  --m-front-color: #22436c;
  --tree-foliage: #ffffff;
  --tree-trunk: #1c2833;
  --grass-blade: #e0f7fa;
  --ice-cap: linear-gradient(180deg, #ffffff 0%, rgba(224, 247, 250, 0.95) 65%, rgba(128, 222, 234, 0.5) 100%);

  --sun-bg: radial-gradient(circle, #ffffff 20%, #e0f7fa 45%, #80deea 70%, #00b0ff 95%);
  --sun-shadow: 0 0 50px rgba(128, 222, 234, 0.8), 0 0 100px rgba(0, 176, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.9);
  --waterfall-color: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(179, 229, 252, 0.9) 40%, rgba(0, 229, 255, 0.95) 70%, rgba(2, 119, 189, 0.98) 100%);
}

/* ================= HIVER ================= */

body.season-winter {
  --sky-gradient: radial-gradient(circle at 50% 20%, #1e3a5f 0%, #0d1b2a 50%, #020509 100%);
  --ground-gradient: linear-gradient(180deg,#fff,#e0f7fa,#80deea);
  --ground-border:#b2ebf2;

  --m-back-color:#0d2137;
  --m-mid-color:#16324f;
  --m-front-color:#22436c;

  --tree-foliage:#ffffff;
  --tree-trunk:#263238;

  --sun-bg:radial-gradient(circle,#fff,#b2ebf2,#00b0ff);
}


/* ================= PRINTEMPS ================= */

body.season-spring {
  --sky-gradient:linear-gradient(#8ed6ff,#d8f3dc);

  --ground-gradient:linear-gradient(180deg,#a8e063,#56ab2f);
  --ground-border:#4caf50;

  --m-back-color:#607d8b;
  --m-mid-color:#78909c;
  --m-front-color:#90a4ae;

  --tree-foliage:#4caf50;
  --tree-trunk:#5d4037;

  --sun-bg:radial-gradient(circle,#fff176,#ffeb3b,#ff9800);
}


/* ================= ETE ================= */

body.season-summer {
  --sky-gradient:linear-gradient(#2196f3,#81d4fa);

  --ground-gradient:linear-gradient(180deg,#7cb342,#33691e);
  --ground-border:#558b2f;

  --m-back-color:#455a64;
  --m-mid-color:#546e7a;
  --m-front-color:#607d8b;

  --tree-foliage:#2e7d32;
  --tree-trunk:#4e342e;

  --sun-bg:radial-gradient(circle,#fff59d,#ffca28,#ff6f00);
}


/* ================= AUTOMNE ================= */

body.season-autumn {
  --sky-gradient:linear-gradient(#ffcc80,#ef6c00);

  --ground-gradient:linear-gradient(180deg,#d4a017,#6d4c41);
  --ground-border:#8d6e63;

  --m-back-color:#5d4037;
  --m-mid-color:#795548;
  --m-front-color:#8d6e63;

  --tree-foliage:#ff9800;
  --tree-trunk:#3e2723;

  --sun-bg:radial-gradient(circle,#fff8e1,#ffb300,#e65100);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "Plus Jakarta Sans", sans-serif;
  user-select: none;
  background: #020509;
}

body, .ground, .sun, .mountain, .tree, .blade {
  animation-play-state: paused !important;
}

body.started {
  animation: cycleSaisons 48s infinite linear !important;
}

body.started .ground {
  animation: cycleSol 48s infinite linear !important;
}

body.started .mountains-container {
  animation: moveMountains 10s linear infinite !important;
}

body.started .sun {
  animation: cycleSoleil 48s infinite linear !important;
}

body.started .tree-foliage, body.started .blade {
  animation-play-state: running !important;
}

/* ================= MONTAGNES================= */

.mountains-container {
  position: absolute;
  bottom: 36px;
  left: 0;
  width: 200%;
  height: 380px;
  display: flex;
  z-index: 2;
  pointer-events: none;
}

.mountain-group {
  position: relative;
  width: 50%;
  height: 100%;
  display: flex;
  align-items: flex-end;
}

.mountain {
  position: absolute;
  bottom: 0;
  transition: background 1.5s ease-in-out;
  filter: drop-shadow(0px 12px 24px rgba(0, 10, 25, 0.85));
}

/* Texture */
.mountain::before {
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(105deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 48%, rgba(5,15,30,0.55) 50%, rgba(2,8,18,0.85) 100%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 5px);
  clip-path: inherit;
}

/* Calotte Enneigée Immense & Cristalline */
.mountain::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 55%;
  background: var(--ice-cap);
  transition: background 1.5s ease-in-out;
  clip-path: inherit;
  filter: drop-shadow(0 6px 15px rgba(220, 245, 255, 0.9));
}

.m1 {
  left: -2%;
  width: 520px;
  height: 320px;
  background: var(--m-back-color);
  opacity: 0.95;
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  z-index: 1;
}

.m2 {
  left: 28%;
  width: 620px;
  height: 380px;
  background: var(--m-mid-color);
  clip-path: polygon(42% 0%, 100% 100%, 0% 100%);
  z-index: 2;
}

.m3 {
  left: 65%;
  width: 480px;
  height: 260px;
  background: var(--m-front-color);
  clip-path: polygon(58% 0%, 100% 100%, 0% 100%);
  z-index: 3;
}

/* Chute */
.waterfall {
  position: absolute;
  bottom: 3px;
  left: 65%;
  width: 25px;
  height: 80px;
  background: var(--waterfall-color);
  z-index: 5;
  border-radius: 4px;
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.9), 0 0 50px rgba(128, 222, 234, 0.6);
  overflow: hidden;
}

.waterfall::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0) 0px,
    rgba(255, 255, 255, 0.98) 8px,
    rgba(128, 222, 234, 0.8) 16px,
    rgba(255, 255, 255, 0) 24px
  );
  animation: flowWater 0.4s linear infinite;
}

.waterfall::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: -12px;
  width: 36px;
  height: 16px;
  background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(128,222,234,0.9) 50%, transparent 100%);
  border-radius: 50%;
  filter: blur(1px);
  animation: mistPulse 0.4s infinite alternate;
}

@keyframes flowWater {
  0% { transform: translateY(-24px); }
  100% { transform: translateY(0); }
}

@keyframes mistPulse {
  0% { transform: scale(0.8); opacity: 0.7; filter: blur(1px); }
  100% { transform: scale(1.4); opacity: 1; filter: blur(3px); }
}

@keyframes moveMountains {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ARBRES*/
.tree{
 position:absolute;
 bottom:0;
 z-index:4;
 display:flex;
 flex-direction:column;
 align-items:center;
 filter:drop-shadow(0 6px 12px rgba(0,10,20,.6));
 animation:moveTrees 10s linear infinite paused;
}
@keyframes moveTrees {
  0% {
    transform:translateX(0);
  }

  100% {
    transform:translateX(-90vw);
  }
} 
.tree-trunk{
    width:16px;
    height:45px;
    border-radius:3px;
    background:linear-gradient(
        90deg,
        #0f171e,
        #2c3e50,
        #0f171e
    );
    box-shadow:
        inset -2px 0 4px rgba(0,0,0,.6),
        0 2px 6px rgba(0,0,0,.5);
}
body.started .tree {
 animation: moveTrees 22s linear infinite !important;
}
.tree-foliage{
    position: relative;
    width: 42px;
    height: 52px;
    background: radial-gradient(circle at 35% 25%,
color-mix(in srgb,var(--tree-foliage),white 40%),
var(--tree-foliage),
color-mix(in srgb,var(--tree-foliage),black 30%));
    clip-path: polygon(
        50% 0%,
        82% 22%,
        68% 22%,
        95% 50%,
        72% 50%,
        100% 82%,
        75% 82%,
        50% 100%,
        25% 82%,
        0% 82%,
        28% 50%,
        5% 50%,
        32% 22%,
        18% 22%
    );
    margin-bottom:-4px;
    transform-origin:bottom center;
    animation:windSway 2s ease-in-out infinite alternate;
    box-shadow:
        inset 0 10px 15px rgba(255,255,255,.9),
        inset 0 -10px 15px rgba(0,150,180,.3),
        0 0 20px rgba(220,245,255,.8);
}

.tree-foliage::before{
    content:"";
    position:absolute;
    top:6px;
    left:8px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    filter:blur(3px);
}

.tree-foliage::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        120deg,
        rgba(255,255,255,.6),
        transparent 45%,
        rgba(0,100,130,.4)
    );
    clip-path:inherit;
}

.t1{
  left:12%;
  transform:scale(.85);
  animation: floatTree 4s ease-in-out infinite alternate;
}

.t2{
  left:85%;
  transform:scale(1.25);
  animation: floatTree 3.2s ease-in-out infinite alternate 0.5s;
}

.t3{
  left:45%;
  transform:scale(.95);
  animation: floatTree 3.7s ease-in-out infinite alternate 1s;
}

@keyframes floatTree {
  0% { transform: translateY(0) scale(var(--s, 1)); }
  100% { transform: translateY(-6px) scale(var(--s, 1)); }
}

.t1 { --s: 0.85; }
.t2 { --s: 1.25; }
.t3 { --s: 0.95; }

@keyframes windSway{
  0%{ transform: rotate(-5deg) scaleY(1); }
  25%{ transform: rotate(4deg) scaleY(1.04); }
  50%{ transform: rotate(8deg) scaleY(0.98); }
  75%{ transform: rotate(-6deg) scaleY(1.02); }
  100%{ transform: rotate(3deg) scaleY(0.96); }
}

/* Herbes Enneigées & Brins de Frimas */
.ground {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 40px;
  z-index: 20;
  background: var(--ground-gradient);
  border-top: 4px solid var(--ground-border);
  box-shadow: 0 -12px 35px rgba(0, 229, 255, 0.4), inset 0 3px 8px rgba(255,255,255,0.9);
  transition: all 1.5s ease-in-out;
}
.alert-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #222;
  color: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  z-index: 999999;
  box-shadow: 0 0 20px black;
}

.alert-box button {
  margin-top: 15px;
  padding: 10px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.grass-container {
  position: absolute;
  top: -12px;
  left: 0;
  width: 100%;
  height: 12px;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
}

.blade {
  width: 4px;
  height: 100%;
  background: var(--grass-blade);
  border-radius: 50% 50% 0 0;
  transform-origin: bottom center;
  transition: background 1.5s ease-in-out;
  animation: grassWind 1.8s ease-in-out infinite alternate;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
}

.blade:nth-child(even) { animation-duration: 2.2s; animation-delay: 0.3s; }
.blade:nth-child(3n) { animation-duration: 1.5s; animation-delay: 0.6s; }

@keyframes grassWind {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(18deg); }
}

/* ================= CIEL, Soleil & Nuages Enneigés ================= */

.board {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  overflow: hidden;
  background: var(--sky-gradient);
  transition: background 1.5s ease-in-out;
}

.sun {
  position: absolute;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  top: 45px;
  right: 80px;
  background: var(--sun-bg);
  box-shadow: var(--sun-shadow);
  transition: all 1.5s ease-in-out;
}

/* Nuages de Tempête Neigeuse */
.cloud {
  position: absolute;
  width: 130px;
  height: 40px;
  background: linear-gradient(180deg, #ffffff 0%, #d4f1f9 60%, #b2ebf2 100%);
  border-radius: 50px;
  box-shadow: 0 8px 30px rgba(0, 180, 216, 0.35), inset 0 -3px 8px rgba(0, 100, 150, 0.2);
  z-index: 4;
}

.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud::before { width: 55px; height: 55px; left: 15px; top: -22px; }
.cloud::after { width: 70px; height: 70px; right: 15px; top: -28px; }

.c1 { top: 70px; left: -150px; animation: moveCloud 22s linear infinite; }
.c2 { top: 140px; left: -200px; transform: scale(0.85); opacity: 0.95; animation: moveCloud 32s linear infinite 6s; }

@keyframes moveCloud {
  0% { left: -150px; }
  100% { left: 105vw; }
}

/* ================= PERSO================= */

.person {
  position: absolute;
  width: 100px;
  height: 125px;
  left: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: center;
}

.person img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 6px 12px rgba(0, 229, 255, 0.6));
  animation: runnerMotion 0.3s infinite alternate ease-in-out;
  text-shadow: 0 0 10px #000;
}

@keyframes runnerMotion {
  from { transform: translateY(0); }
  to { transform: translateY(-4px); }
}

/* Aura de chakra */
.person::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--chakra-glow) 0%, rgba(0, 176, 255, 0.4) 50%, transparent 80%);
  filter: blur(8px);
  z-index: 1;
  animation: elegantAura 1.4s infinite alternate ease-in-out;
}

@keyframes elegantAura {
  0% { transform: scale(0.92); opacity: 0.7; filter: blur(6px); }
  100% { transform: scale(1.2); opacity: 1; filter: blur(12px); }
}

/* ================= OBSTACLES ================= */

/* Rasenshuriken*/
.block_bas {
  position: absolute;
  right: -100px;
  width: 47px;
  height: 50px;
  bottom: 35px;
  z-index: 100;
  background: radial-gradient(circle, #ffffff 15%, #b2ebf2 40%, #00e5ff 70%, #0056b3 100%);
  clip-path: polygon(50% 0%, 65% 28%, 100% 15%, 72% 50%, 100% 85%, 65% 72%, 50% 100%, 35% 72%, 0% 85%, 28% 50%, 0% 15%, 35% 28%);
  box-shadow: 0 0 30px #00e5ff, 0 0 60px #80deea;
  animation: spinRasenshuriken 0.12s linear infinite;
}

@keyframes spinRasenshuriken {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* dragon*/
.block_haut {
  position: absolute;
  right: -100px;
  width: 85px;
  height: 95px;
  bottom: 85px;
  z-index: 100;
  background: radial-gradient(circle at 30% 30%, #ffffff 0%, #80d8ff 30%, #0091ea 65%, #0d47a1 100%);
  clip-path: polygon(100% 0%, 80% 20%, 95% 40%, 60% 50%, 90% 70%, 70% 85%, 100% 100%, 30% 90%, 0% 50%, 30% 10%);
  filter: drop-shadow(0 0 25px #00b0ff) drop-shadow(0 0 45px #80d8ff);
  animation: katonRoar 0.2s infinite alternate;
}

@keyframes katonRoar {
  0% { transform: scaleY(0.95) translateX(0); }
  100% { transform: scaleY(1.08) translateX(-5px); }
}

/* Shiki Fūjin Sceau Flottant Glacé Démoniaque */
.laser {
  position: absolute;
  right: -100px;
  bottom: 75px;
  width: 32px;
  height: 135px;
  background: linear-gradient(180deg, rgba(224, 247, 250, 0.98) 0%, rgba(128, 222, 234, 0.9) 40%, rgba(0, 96, 100, 0.98) 100%);
  border-radius: 18px;
  border: 2px solid #ffffff;
  box-shadow: 0 0 30px #00e5ff, inset 0 0 15px #ffffff;
  z-index: 100;
  animation: deathGodGhost 0.8s infinite alternate ease-in-out;
}

.laser::before {
  content: "死";
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Shojumaru', serif;
  color: #002b49;
  font-size: 20px;
  text-shadow: 0 0 12px #80deea, 0 0 20px #ffffff;
}

@keyframes deathGodGhost {
  0% { transform: translateY(0); filter: drop-shadow(0 0 12px #00b0ff); }
  100% { transform: translateY(-18px); filter: drop-shadow(0 0 30px #80deea); }
}

/* Piquets de Cristal de Glace Sanglante */
.spike {
  position: absolute;
  right: -100px;
  bottom: 35px;
  width: 50px;
  height: 55px;
  background: linear-gradient(180deg, #ffffff 0%, #80deea 35%, #00838f 100%);
  clip-path: polygon(20% 100%, 0% 30%, 35% 50%, 50% 0%, 65% 50%, 100% 30%, 80% 100%);
  filter: drop-shadow(0 0 20px #00e5ff);
  z-index: 100;
  animation: spikePulse 0.3s infinite alternate;
}

@keyframes spikePulse {
  0% { transform: scaleY(1); }
  100% { transform: scaleY(1.18); }
}

/* Mouvements du Joueur */
.person.jump {
  animation: jump 1s cubic-bezier(.28,.84,.42,1);
}

@keyframes jump {
  0% { transform: translateY(0); }
  50% { transform: translateY(-200px); }
  75%{
    transform: translateY(-190px); 
  }
  100% { transform: translateY(0); }
}

.person.slide {
  animation: slide .8s cubic-bezier(.25,.8,.25,1);
}

@keyframes slide {
  0% { transform: translateY(0) scaleY(1); }
  20% { transform: translateY(28px) scaleY(.45); }
  80% { transform: translateY(28px) scaleY(.45); }
  100% { transform: translateY(0) scaleY(1); }
}

.hitbox {
  position: absolute;
  width: 45px;
  height: 120px;
  bottom: 0;
  left: 0;
}

.person.slide .hitbox {
  width: 85px;
  height: 55px;
}





/* ================= TIMER ================= */

.timer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(2, 8, 18, 0.92);
  backdrop-filter: blur(16px);
}

.timer p {
  font-size: clamp(90px, 25vw, 200px);
  color: #80deea;
  font-weight: 900;
  font-family: 'Shojumaru', sans-serif;
  text-shadow:
    0 0 20px #00e5ff, 0 0 40px #00838f;
  animation: pulse 1s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes pulse {
  0% { transform: scale(0.8); opacity: 0.5; filter: blur(2px); }
  50% { transform: scale(1.1); opacity: 1; filter: blur(0px); }
  100% { transform: scale(0.9); opacity: 0.8; filter: blur(1px); }
}

.timer.go {
  animation: hideTimer .6s ease-in forwards;
}

@keyframes hideTimer {
  100% {
    opacity: 0;
    transform: scale(2.5);
    visibility: hidden;
  }
}

/* ================= INTERFACE ================= */

.menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  align-items: center;
  padding: 25px;
  background: radial-gradient(circle at center, #0b2239 0%, #040e18 60%, #01050a 100%);
  z-index: 10000;
  border: 3px solid #00e5ff;
  box-shadow: inset 0 0 80px rgba(0, 229, 255, 0.3);
}

.logo h1 {
  font-family: 'Shojumaru', cursive, sans-serif;
  font-size: 42px;
  color: #fff;
  text-shadow: 0 0 20px #00e5ff, 0 0 40px #00838f;
  text-align: center;
}

.logo p {
  color: #80deea;
  font-size: 15px;

<script>
// --- DOM & GAME STATE ---
const game_over_score = document.getElementById("finalScore");
const gameOverModal = document.getElementById("gameOver");
const board = document.querySelector(".board");
const person = document.querySelector(".person");
const hitbox = document.querySelector(".hitbox");
const menu = document.getElementById("menu");
const timer = document.querySelector(".timer");
const text = document.querySelector(".timer p");

let movingIntervals = [];
let animationFrame = null;
let obstacleInterval = null;
let coinInterval = null;
let interval_season = null;

let gameOver = false;
let gamePaused = false;
let score = 0;
let count = 3;
let coins = Number(localStorage.getItem("coins")) || 0;

// --- AUDIO ---
const soundTimer = new Howl({ src: ["timer.mp3"], volume: 1 });
const naruto = new Howl({ src: ["naruto.mp3"], volume: 1, loop: true });

// --- INITIALIZATION ---
function initStats() {
  const best = localStorage.getItem("score") || 0;
  document.getElementById("bestScore").textContent = best;
  document.getElementById("coins").textContent = coins;
  document.getElementById("coinCount").textContent = coins;
}
initStats();

// --- GAME CONTROLS & TIMERS ---
function startTimer() {
  cleanupGame(); // Prevent duplicate running loops
  
  gamePaused = false;
  gameOver = false;
  count = 3;

  menu.style.display = "none";
  gameOverModal.classList.add("hidden");
  gameOverModal.style.display = ""; // Reset inline style if previously set
  
  timer.style.display = "flex";
  timer.classList.remove("go");
  text.textContent = count;

  const countdown = setInterval(() => {
    soundTimer.play();
    text.textContent = count;
    count--;

    if (count < 0) {
      clearInterval(countdown);
      text.textContent = "GO!";

      setTimeout(() => {
        timer.classList.add("go");
        soundTimer.stop();
        document.body.classList.add("started");

        // Start game loops
        lancerObstacles();
        lancerCoin();
        seasons();
        gameloop();
        naruto.play();
      }, 1000);
    }
  }, 1000);
}

function cleanupGame() {
  // Clear interval trackers
  movingIntervals.forEach(clearInterval);
  movingIntervals = [];

  clearInterval(obstacleInterval);
  clearInterval(coinInterval);
  clearInterval(interval_season);

  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }

  // Remove existing game elements
  document.querySelectorAll(".block_bas, .block_haut, .spike, .laser, .coinBas, .coinHaut")
    .forEach(el => el.remove());

  // Reset player actions
  person.classList.remove("jump", "slide");
}

// --- OBSTACLES & COINS ---
function createEntity(className, innerHTML, speed, onBoundary) {
  let position = -100;
  const element = document.createElement("div");
  element.classList.add(className);
  if (innerHTML) element.innerHTML = innerHTML;
  board.appendChild(element);

  const interval = setInterval(() => {
    if (!gamePaused) {
      position += speed;
      element.style.right = position + "px";
    }

    if (position > window.innerWidth) {
      clearInterval(interval);
      element.remove();
      if (onBoundary) onBoundary();
    }
  }, 15);

  movingIntervals.push(interval);
}

function coin1() { createEntity("coinBas", "🪙", 3); }
function coin2() { createEntity("coinHaut", "🪙", 3); }

function obstacle1() { createEntity("block_bas", null, 4, incrementScore); }
function obstacle2() { createEntity("block_haut", null, 4, incrementScore); }
function obstacle3() { createEntity("spike", null, 4, incrementScore); }
function obstacle4() { createEntity("laser", null, 5, incrementScore); }

function incrementScore() {
  score++;
  document.getElementById("score").textContent = score;
}

function lancerObstacles() {
  obstacleInterval = setInterval(() => {
    if (gamePaused) return;
    const hasard = Math.floor(Math.random() * 7);
    switch (hasard) {
      case 0: case 1: case 2: obstacle1(); break;
      case 3: case 4: obstacle2(); break;
      case 5: obstacle3(); break;
      case 6: obstacle4(); break;
    }
  }, 7500);
}

function lancerCoin() {
  coinInterval = setInterval(() => {
    if (gamePaused) return;
    Math.random() > 0.5 ? coin1() : coin2();
  }, 20000);
}

// --- COLLISIONS & LOOP ---
function collision(objet) {
  const p = hitbox.getBoundingClientRect();
  const o = objet.getBoundingClientRect();

  return !(
    p.right < o.left ||
    p.left > o.right ||
    p.bottom < o.top ||
    p.top > o.bottom
  );
}

function gameloop() {
  if (gameOver || gamePaused) return;

  const obstacles = document.querySelectorAll(".block_haut, .block_bas, .laser, .spike");
  obstacles.forEach(obstacle => {
    if (collision(obstacle)) {
      gameOver = true;
      finJeu();
    }
  });

  const coinsElements = document.querySelectorAll(".coinHaut, .coinBas");
  coinsElements.forEach(coin => {
    if (collision(coin)) {
      addCoin();
      coin.remove();
    }
  });

  animationFrame = requestAnimationFrame(gameloop);
}

// --- SEASONS ---
function seasons() {
  const seasonsList = ["season-spring", "season-summer", "season-autumn", "season-winter"];
  let index = 0;

  interval_season = setInterval(() => {
    if (gamePaused) return;
    document.body.classList.remove(...seasonsList);
    document.body.classList.add(seasonsList[index]);
    index = (index + 1) % seasonsList.length;
  }, 20000);
}

// --- MOVEMENT ---
function jump() {
  if (person.classList.contains("jump")) return;
  person.classList.add("jump");
  setTimeout(() => person.classList.remove("jump"), 1000);
}

function slide() {
  if (person.classList.contains("slide")) return;
  person.classList.add("slide");
  setTimeout(() => person.classList.remove("slide"), 800);
}

// Gestures & Key Bindings
const hammer = new Hammer(board, { touchAction: "none" });
hammer.get("swipe").set({ direction: Hammer.DIRECTION_VERTICAL, threshold: 20 });
hammer.on("swipeup", () => { if (!gamePaused) jump(); });
hammer.on("swipedown", () => { if (!gamePaused) slide(); });

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !gamePaused) jump();
  if (e.code === "ArrowDown" && !gamePaused) slide();
});

// --- GAME OVER & ECONOMY ---
function finJeu() {
  gamePaused = true;
  clearInterval(obstacleInterval);
  clearInterval(coinInterval);
  clearInterval(interval_season);

  gameOverModal.classList.remove("hidden");
  timer.style.display = "none";
  naruto.stop();

  game_over_score.textContent = score;

  const ancienScore = localStorage.getItem("score");
  if (ancienScore === null || score > Number(ancienScore)) {
    localStorage.setItem("score", score);
    document.getElementById("bestScore").textContent = score;
  } else {
    document.getElementById("bestScore").textContent = ancienScore;
  }
}

function addCoin() {
  coins++;
  localStorage.setItem("coins", coins);
  document.getElementById("coins").textContent = coins;
  document.getElementById("coinCount").textContent = coins;
}

// --- BUTTON EVENTS ---
document.querySelector(".continue-btn").addEventListener("click", () => {
  if (coins >= 10) {
    coins -= 10;
    localStorage.setItem("coins", coins);
    document.getElementById("coins").textContent = coins;
    document.getElementById("coinCount").textContent = coins;

    startTimer(); 
  }else {
    Toastify({
  text: "🪙 Insufficient Coins!\nYou need at least 10 coins to continue.",
  duration: 5000,
  gravity: "top",
  position: "center",
  close: true,
  stopOnFocus: true,
  style: {
    background: "linear-gradient(135deg, #ff4b2b, #ff416c)",
    color: "#fff",
    borderRadius: "12px",
    fontWeight: "bold",
    padding: "15px",
    boxShadow: "0 8px 20px rgba(0,0,0,0.3)"
  }
}).showToast();
  }
}); 




document.querySelector(".replay-btn").addEventListener("click", () => {
  score = 0;
  document.getElementById("score").textContent = score;
  document.body.classList.remove("started", "season-spring", "season-summer", "season-autumn", "season-winter");
  startTimer();
});

document.querySelector(".home-btn").addEventListener("click", () => {
  gamePaused = true;
  gameOver = false;
  score = 0;

  cleanupGame();

  gameOverModal.classList.add("hidden");
  timer.style.display = "flex";
  menu.style.display = "flex";

  document.getElementById("score").textContent = 0;
  document.body.classList.remove("started", "season-spring", "season-summer", "season-autumn", "season-winter");

  naruto.stop();
  soundTimer.stop();
});
</script>
