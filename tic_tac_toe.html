<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIC-TAC-TOE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />


 
<style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600;800&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #FFD1DC;
    } 
.line{
 position: absolute;
 width:0;
 height: 13px;
 left:50%;
 top:50%;
 background:#e63946; 
 box-shadow: 0 0 10px #e63946;
 border-radius:10px;
 z-index: 20;
 transition:0.5s;
}
.line_blue{
 position: absolute;
 width:0;
 height: 13px;
 left:50%;
 top:50%;
 background:#457b9d;  
 box-shadow: 0 0 10px #457b9d;
 border-radius:10px;
 z-index: 20;
 transition:0.5s;
}
.line.top{
 transform:translate(-50%,-100px);
}

.line.middle{
 transform:translate(-50%,0);
}

.line.bottom{
 transform:translate(-50%,100px);
}


.line.left,
.line.center,
.line.right{
 transform:translate(-50%,-50%) rotate(90deg);
}


.line.left{
 left:16.5%;
}

.line.center{
 left:50%;
}

.line.right{
 left:83.5%;
}


.line.diagonal1{
 width: 150%;
 transform:translate(-50%,-50%) rotate(45deg);
}


.line.diagonal2{
 width: 150%;
 transform:translate(-50%,-50%) rotate(-45deg);
}


.line_blue.top{
 transform:translate(-50%,-100px);
}

.line_blue.middle{
 transform:translate(-50%,0);
}

.line_blue.bottom{
 transform:translate(-50%,100px);
}


.line_blue.left,
.line_blue.center,
.line_blue.right{
 transform:translate(-50%,-50%) rotate(90deg);
}


.line_blue.left{
 left:16.5%;
}

.line_blue.center{
 left:50%;
}

.line_blue.right{
 left:83.5%;
}


.line_blue.diagonal1{
 width: 150%;
 transform:translate(-50%,-50%) rotate(45deg);
}


.line_blue.diagonal2{
 width: 150%;
 transform:translate(-50%,-50%) rotate(-45deg);
}

.case {
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;

  aspect-ratio: 1 / 1;
  font-size: clamp(35px, 12vw, 60px);
  font-weight: bold;
  cursor: pointer;

  border: 5px solid #333;
}

.game {
  width: min(90vw, 400px);
  aspect-ratio: 1 / 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  position: relative;
}

#c1{
  border-top: none;
  border-left: none;
}
#c2{
  border-top: none;
}
#c3{
  border-top: none;
  border-right: none;
}
#c4{
  border-left: none;
}
#c6{
  border-right: none;
}
#c7{
  border-bottom: none;
  border-left: none;
}
#c8{
  border-bottom: none;
  
}
#c9{
  border-bottom: none;
  border-right: none;
}
.fa-o{
  color: rgba(000,000,255,0.6);
}
.fa-x{
  
  color: rgba(255,000,000,0.6);
}
.turn_red{
  
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);

  width: 60vw;
  max-width: 260px;
  height: 70px;

  background:rgba(255,000,000,0.6);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 1;
  border-radius: 999px 999px 0 0;
  font-weight: bold;
  transition: 0.9s all ease;
}
.turn_blue{
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%) rotate(180deg);

  width: 60vw;
  max-width: 260px;
  height: 70px;
  
  background: rgba(000,000,255,0.6);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 999px 999px 0 0;
  font-weight: bold;
  opacity: 0;
  transition: 0.9s all ease;
}

.case i {
  animation: apparition 0.3s ease;
}

@keyframes apparition {
  from {
    transform: scale(0);
    opacity: 0;
  }

  to {
    transform: scale(1.08);
    opacity: 1;
  }
}

#exit {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 55px;
            height: 60px;
            padding: 0;
            border: none;
            border-radius: 0 30px 30px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #exit:active {
            transform: translateY(-50%) scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }


        .timer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(12px);
        }

        .timer p {
            font-size: clamp(90px, 25vw, 200px);
            color: #fff;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 50px rgba(0, 217, 255, 0.6),
                0 0 100px rgba(255, 0, 85, 0.6);
            animation: pulse 1s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .timer.go {
            animation: hideTimer .6s ease-in forwards;
        }

        @keyframes hideTimer {
            100% {
                opacity: 0;
                transform: scale(2);
                visibility: hidden;
            }
        }

        .blue_wins,
        .red_wins {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: clamp(35px, 8vw, 70px);
            font-weight: 900;
            color: white;
            backdrop-filter: blur(15px);
            text-align: center;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: winPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes winPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .blue_wins {
            background: radial-gradient(circle, rgba(0, 102, 255, 0.95), rgba(5, 15, 40, 0.98));
            box-shadow: inset 0 0 100px #00d9ff;
        }

        .red_wins {
            background: radial-gradient(circle, rgba(255, 0, 81, 0.95), rgba(40, 5, 15, 0.98));
            box-shadow: inset 0 0 100px #ff0055;
        }

        .blue_wins i, .red_wins i {
            margin-top: 15px;
            color: #ffd700;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
            animation: floatCrown 2s infinite ease-in-out;
        }

        @keyframes floatCrown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
.tie{
  position: fixed;
  inset: 0;
  background: transparent;
  backdrop-filter: blur(5px);
  z-index: 10000;
  backdrop-filter: blur(5px);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 50px;
  flex-direction: column;
  color: white;
  font-weight: 900;
  font-family: "Poppins", sans-serif;

  overflow: hidden;
  display: none;
}
.shrink i {
  animation: shrinkEffect 0.6s ease forwards;
}

@keyframes shrinkEffect {
  0% {
    transform: scale(1);
    opacity: 1;
  }

  100% {
    transform: scale(0);
    opacity: 0;
  }
}
