      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html, body {
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden !important; /* Bloque tout débordement de page */
}

body {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background-color: #0b0c10;
    transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
    user-select: none;
    background: #FFD1DC;
}
.turn_red{
  
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);

  width: 60vw;
  max-width: 260px;
  height: 70px;

  background:rgba(255,000,000,0.6);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 1;
  border-radius: 999px 999px 0 0;
  font-weight: bold;
  transition: 0.9s all ease;
}
.turn_blue{
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%) rotate(180deg);

  width: 60vw;
  max-width: 260px;
  height: 70px;
  
  background: rgba(000,000,255,0.6);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 999px 999px 0 0;
  font-weight: bold;
  opacity: 0;
  transition: 0.9s all ease;
}
/* --- BOUTON RETOUR --- */
#exit {
    position: fixed;
    top: 5%;
    left: 0;
    width: 55px;
    height: 60px;
    padding: 0;
    border: none;
    border-radius: 0 30px 30px 0;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-left: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10000;
    transition: all 0.2s ease;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

#exit:active {
    transform: translateY(-50%) scale(0.95);
    background: rgba(255, 255, 255, 0.25);
}

/* --- COMPTE À REBOURS --- */
.timer {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(5, 5, 8, 0.85);
    backdrop-filter: blur(12px);
}

.timer p {
    font-size: clamp(90px, 25vw, 200px);
    color: #fff;
    font-weight: 900;
    font-family: 'Orbitron', sans-serif;
    text-shadow:
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 50px rgba(0, 217, 255, 0.6),
        0 0 100px rgba(255, 0, 85, 0.6);
    animation: pulse 1s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.8; }
}

.timer.go {
    animation: hideTimer .6s ease-in forwards;
}

@keyframes hideTimer {
    100% {
        opacity: 0;
        transform: scale(2);
        visibility: hidden;
    }
}

/* --- ECRANS DE VICTOIRE --- */
.blue_wins,
.red_wins {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: clamp(35px, 8vw, 70px);
    font-weight: 900;
    color: white;
    backdrop-filter: blur(15px);
    text-align: center;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    animation: winPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes winPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.blue_wins {
    background: radial-gradient(circle, rgba(0, 102, 255, 0.95), rgba(5, 15, 40, 0.98));
    box-shadow: inset 0 0 100px #00d9ff;
}

.red_wins {
    background: radial-gradient(circle, rgba(255, 0, 81, 0.95), rgba(40, 5, 15, 0.98));
    box-shadow: inset 0 0 100px #ff0055;
}

.blue_wins i, .red_wins i {
    margin-top: 15px;
    color: #ffd700;
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
    animation: floatCrown 2s infinite ease-in-out;
}

@keyframes floatCrown {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
}
/* ===========================
   PLATEAU
=========================== */

      .board{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1vw, 8px);

    width: min(95vw, 650px);
    aspect-ratio: 7/6;

    padding: clamp(6px, 1vw, 10px);

    background: linear-gradient(135deg, #ffd700, #ffb300);
    border-radius: clamp(18px,3vw,30px);

    box-shadow:
        0 20px 45px rgba(0,0,0,.35),
        inset 0 3px 10px rgba(255,255,255,.25),
        inset 0 -5px 15px rgba(0,0,0,.2);
        box-sizing: border-box;
}
.column{
    display:flex;
    flex-direction:column-reverse;
    justify-content:space-between;
    align-items:center;
    padding: clamp(3px,0.8vw,7px);
    cursor:pointer;
    height: 100%;
}
.column:hover{
    background: rgba(255, 255, 255, 0.25);
    border-radius: 20px;
}

.column p{
    width:100%;
    aspect-ratio:1;

    border-radius:50%;

    background:radial-gradient(circle at 35% 35%, #fff, #d9d9d9);

    box-shadow:
        inset 0 4px 8px rgba(255,255,255,.7),
        inset 0 -5px 10px rgba(0,0,0,.15),
        0 2px 5px rgba(0,0,0,.2);

}
@media (orientation: landscape){

    .board{
        height:90vh;
        width:auto;
    }

}

.win{

@keyframes flash{
    0%,100%{

    }

    50%{
        transform: scale(1.12);
        box-shadow:
            0 0 20px #fff,
            0 0 40px #ffd700,
            0 0 80px #ffae00;
    }
}

@keyframes float{
    0%,100%{
        translate: 0 0;
    }

    50%{
        translate: 0 -6px;
    }
}
