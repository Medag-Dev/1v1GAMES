* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-family:"Poppins", sans-serif;
  user-select:none;
  background: #FFD1DC;
}
#exit {
            position: fixed;
            top: 35px;
            left: 0;
            transform:translateY(-50%);
            width: 55px;
            height: 60px;
            padding: 0;
            border: none;
            border-radius: 0 30px 30px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

        .timer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            backdrop-filter: blur(12px);
        }

        .timer p {
            font-size: clamp(90px, 25vw, 200px);
            color: #fff;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 50px rgba(0, 217, 255, 0.6),
                0 0 100px rgba(255, 0, 85, 0.6);
            animation: pulse 1s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .timer.go {
            animation: hideTimer .6s ease-in forwards;
        }

        @keyframes hideTimer {
            100% {
                opacity: 0;
                transform: scale(2);
                visibility: hidden;
            }
        }


        .blue_wins,
        .red_wins,.draw {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: clamp(35px, 8vw, 70px);
            font-weight: 900;
            color: white;
            backdrop-filter: blur(15px);
            text-align: center;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: winPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes winPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .blue_wins {
            background: radial-gradient(circle, rgba(0, 102, 255, 0.95), rgba(5, 15, 40, 0.98));
            box-shadow: inset 0 0 100px #00d9ff;
        }
        .draw{
            background: transparent;
        }
        .red_wins {
            background: radial-gradient(circle, rgba(255, 0, 81, 0.95), rgba(40, 5, 15, 0.98));
            box-shadow: inset 0 0 100px #ff0055;
        }

        .blue_wins i, .red_wins i {
            margin-top: 15px;
            color: #ffd700;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
            animation: floatCrown 2s infinite ease-in-out;
        }

        @keyframes floatCrown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }





/* ECRANS VICTOIRE */
.score-up{
  animation: scorePop .3s;
}

@keyframes scorePop{
  50%{
    transform:translateY(-50%) scale(1.3);
  }
}

.level-screen {

position:fixed;
inset:0;

z-index:20000;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:linear-gradient(135deg,#667eea,#764ba2);

font-size:clamp(40px,10vw,70px);

.levels {

display:flex;

justify-content:center;

align-items:center;

gap:20px;

max-width:700px;

}


.level {

width:180px;

height:70px;

border:none;

border-radius:25px;

font-size:25px;

font-weight:900;

cursor:pointer;

transition:.3s;

color:white;

transform:scale(1.1);

}


.easy {

background:#4caf50;

.medium {

background:#ff9800;

}


.hard {

.blue-score{

.separator{

}

.red-score{

.turn_red{

  transform: translateX(-50%);

  height: 70px;

  color: white;

  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 1;

  font-weight: bold;
  transition: 0.9s all ease;
}
.turn_blue{
  position: fixed;
  top: 0;

  transform: translateX(-50%) rotate(180deg);

  max-width: 260px;
  height: 70px;

  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 999px 999px 0 0;
  font-weight: bold;
  opacity: 0;
  transition: 0.9s all ease;

/*jeu*/


.board{
    position:absolute;
    top:100px;
    bottom:100px;
    left:20px;
    right:20px;

    display:none;

    gap:12px;
    padding:10px;

    align-items:center;
    justify-content:center;
}


/* GRILLES */

#board-easy{
    grid-template-columns:repeat(3, minmax(70px,110px));
    grid-template-rows:repeat(4, minmax(70px,110px));
}
#board-medium{
    grid-template-columns:repeat(3, minmax(70px,100px));
    grid-template-rows:repeat(6, minmax(70px,100px));
}
#board-hard{
    grid-template-columns:repeat(4, minmax(60px,90px));
    grid-template-rows:repeat(6, minmax(60px,90px));
}



/* CARTE */

.card{

    width:100%;
    height:100%;

    min-width:45px;
    min-height:45px;

    cursor:pointer;

    transform-style:preserve-3d;

    transition:.5s;

}



/* face */

.front,
.back{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:20px;

    backface-visibility:hidden;

    font-size:clamp(20px,5vw,45px);

}



/* dos */

.back{

background:
linear-gradient(135deg,#ffffff,#cbd5e1);


box-shadow:

inset 0 0 15px rgba(255,255,255,.8),
0 8px 20px rgba(0,0,0,.25);


color:#2563eb;

font-size:35px;

font-weight:900;

}



/* devant */

.front{

background:
linear-gradient(135deg,#2563eb,#111827);


transform:rotateY(180deg);


box-shadow:

inset 0 0 20px rgba(255,255,255,.3),
0 8px 25px rgba(0,0,0,.4);


color:white;

}



/* retournement */

.card.flip{

transform:
rotateY(180deg)
scale(1.08);

}



/* effet clic */

.card:active{

transform:
rotateY(180deg)
scale(.95);

}

.matched {
  animation: matchAnimation 0.6s ease-in-out;
}

@keyframes matchAnimation {
  0% {
    transform: scale(1);
  }

  30% {
    transform: scale(1.15) rotate(5deg);
  }

  60% {
    transform: scale(1.15) rotate(-5deg);
  }

  100% {
    transform: scale(1) rotate(0deg);
  }
}
